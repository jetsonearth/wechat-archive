[project]
name = "wechat-archive"
version = "0.2.0"
description = "Read your own WeChat history locally — a fast, incremental index for you and your agent."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wx = "wxa.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wxa", "wxa.vendor"]

[tool.setuptools.package-data]
wxa = ["SKILL.md"]
"wxa.vendor" = ["*.md", "*.json"]
